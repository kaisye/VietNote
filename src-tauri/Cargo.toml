[package]
name = "vietnote"
version = "0.8.2"
description = "VietNote desktop shell"
authors = ["VietNote"]
edition = "2021"

[lib]
name = "vietnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "rustls-tls-native-roots"], default-features = false }
clipclip = { version = "0.2.5", default-features = false }
base64 = "0.22"
sha2 = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSDictionary", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[patch.crates-io]
# clipclip captures through cpal. The vendored copy keeps VietNote's own audio
# out of the Core Audio tap and tolerates WASAPI loopback discontinuities.
cpal = { path = "../vendor/cpal" }
