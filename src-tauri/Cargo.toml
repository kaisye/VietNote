[package]
name = "vietnote"
version = "0.2.0"
description = "VietNote desktop shell"
authors = ["VietNote"]
edition = "2021"

[lib]
name = "vietnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clipclip = { version = "0.2.5", default-features = false }
base64 = "0.22"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

[patch.crates-io]
# clipclip uses cpal's Core Audio process tap. Keep VietNote's own TTS out of
# that tap so spoken translations cannot be recognized and translated again.
cpal = { path = "../vendor/cpal" }
