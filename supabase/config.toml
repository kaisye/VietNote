project_id = "vietnote"

[functions.speech-session]
verify_jwt = true

# Old names of speech-session, file-job and checkout, for apps up to 0.8.9.
[functions.soniox-key]
verify_jwt = true

[functions.soniox-reconcile]
# Authenticated by the x-cron-secret header instead of a user JWT.
verify_jwt = false

[functions.file-job]
verify_jwt = true

[functions.soniox-file]
verify_jwt = true

[functions.ai-complete]
verify_jwt = true

[functions.checkout]
verify_jwt = true

[functions.payos]
verify_jwt = true

[functions.payos-webhook]
# Authenticated by the payOS payload signature instead of a user JWT.
verify_jwt = false
