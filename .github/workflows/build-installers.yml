name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: "-"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Require release API key
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -f vendor/cpal/Cargo.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: asr/requirements-release.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The updater compares this version with latest.json, so a tag must ship its own version.
      - name: Use tag as app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e 'const fs=require("fs"),f="src-tauri/tauri.release.conf.json",c=JSON.parse(fs.readFileSync(f));c.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync(f,JSON.stringify(c,null,2))'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable audio worker
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r asr/requirements-release.txt
          python -m PyInstaller --noconfirm --clean --onedir \
            --name vietnote-worker \
            --distpath worker-dist \
            --workpath worker-build \
            --specpath worker-build \
            --paths "$GITHUB_WORKSPACE/asr" \
            --collect-data certifi \
            --collect-submodules zerotts --collect-data zerotts \
            --exclude-module scipy --exclude-module soundfile --exclude-module sounddevice --exclude-module huggingface_hub \
            --python-option "X utf8" \
            asr/server.py
          worker-dist/vietnote-worker/vietnote-worker --help >/dev/null

      # Only the native runtime ships in the app; the GGUF weights are downloaded
      # from Settings, pinned to the revision/SHA in src-tauri/src/diarization_model.rs.
      - name: Build Nemotron 3 diarization runtime
        shell: bash
        run: |
          python -m venv .venv
          NEMOTRON_SKIP_MODEL=1 bash scripts/setup-diarization.sh
          python scripts/bundle-diarization-libs.py
          node -e 'const fs=require("fs"),f="src-tauri/tauri.release.conf.json",c=JSON.parse(fs.readFileSync(f));c.bundle.resources.push("../nemotron-dist");fs.writeFileSync(f,JSON.stringify(c,null,2))'

      - name: Build macOS installer
        run: npm run tauri build -- --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: VietNote-macOS-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Require release API key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY"
          }
          foreach ($file in @('vendor/cpal/Cargo.toml')) {
            if (-not (Test-Path $file)) { throw "Missing release resource: $file" }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: asr/requirements-release.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The updater compares this version with latest.json, so a tag must ship its own version.
      - name: Use tag as app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e 'const fs=require("fs"),f="src-tauri/tauri.release.conf.json",c=JSON.parse(fs.readFileSync(f));c.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync(f,JSON.stringify(c,null,2))'

      - name: Install frontend dependencies
        run: npm ci

      # Frozen apps ignore PYTHONUTF8; UTF-8 mode keeps Vietnamese text from
      # being read or printed as cp1252.
      - name: Build portable audio worker
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r asr/requirements-release.txt
          python -m PyInstaller --noconfirm --clean --onedir `
            --name vietnote-worker `
            --distpath worker-dist `
            --workpath worker-build `
            --specpath worker-build `
            --paths "$env:GITHUB_WORKSPACE\asr" `
            --collect-data certifi `
            --collect-submodules zerotts --collect-data zerotts `
            --exclude-module scipy --exclude-module soundfile --exclude-module sounddevice --exclude-module huggingface_hub `
            --python-option "X utf8" `
            asr/server.py
          .\worker-dist\vietnote-worker\vietnote-worker.exe --help | Out-Null

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VietNote-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The macOS artifact spans bundle/dmg and bundle/macos, so it keeps those subfolders.
      - name: Flatten installers
        shell: bash
        run: |
          find installers -mindepth 2 -type f -exec mv {} installers/ \;
          ls -la installers

      - name: Remove old assets for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              if [[ -n "$asset" ]]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          fi

      - name: Write updater manifest
        shell: bash
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          mac=$(cd installers && ls *.app.tar.gz)
          win=$(cd installers && ls *-setup.exe)
          jq -n --arg version "${GITHUB_REF_NAME#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$(cat "installers/$mac.sig")" --arg mac_url "$base/$mac" \
            --arg win_sig "$(cat "installers/$win.sig")" --arg win_url "$base/$win" \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
              "windows-x86_64": {signature: $win_sig, url: $win_url}}}' > installers/latest.json
          cat installers/latest.json

      # Fixed names keep the website's releases/latest/download/... links valid across versions.
      - name: Add version-less download copies
        shell: bash
        run: |
          cp installers/*.dmg installers/VietNote_aarch64.dmg
          cp installers/*-setup.exe installers/VietNote_x64-setup.exe
          ls -la installers

      - name: Replace release installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*.dmg
            installers/*-setup.exe
            installers/*.app.tar.gz
            installers/*.sig
            installers/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
